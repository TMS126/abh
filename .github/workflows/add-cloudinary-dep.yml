# .github/workflows/add-cloudinary-dep.yml
name: Add Cloudinary Dependency

on:
  workflow_dispatch:

jobs:
  add-dependency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install existing dependencies
        run: pnpm install --frozen-lockfile

      - name: Add cloudinary package
        run: pnpm add cloudinary

      - name: Commit updated package.json and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --staged --quiet || git commit -m "chore: add cloudinary dependency for server-side upload"
          git push
